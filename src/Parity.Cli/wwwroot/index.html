<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parity — design fidelity report</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Parity</div>
  <div id="gate-badge" class="badge">…</div>
  <div id="score" class="score" title="Fidelity score: share of design nodes implemented faithfully"></div>
  <nav id="target-tabs" class="tabs"></nav>
  <div class="spacer"></div>
  <div id="watch-dot" class="watch-dot" title="watch mode" hidden></div>
  <span id="generated-at" class="muted"></span>
  <div class="mode-switch">
    <button id="mode-inspect" class="active">Inspect</button>
    <button id="mode-map">Map</button>
  </div>
  <button id="rerun" class="primary">Re-scan</button>
</header>

<main>
  <aside id="sidebar"></aside>

  <section class="viewer">
    <div class="toolbar">
      <label><input type="checkbox" id="show-design" checked> Design boxes</label>
      <label><input type="checkbox" id="show-rendered" checked> Implementation boxes</label>
      <label><input type="checkbox" id="only-diffs"> Only show diffs</label>
      <span class="legend">
        <i class="dot critical"></i>critical
        <i class="dot serious"></i>serious
        <i class="dot medium"></i>medium
        <i class="dot none"></i>match
        <i class="dot design"></i>design
      </span>
    </div>
    <div id="stage" class="stage">
      <img id="shot" alt="Page screenshot">
      <div id="rects"></div>
    </div>
    <div id="map-bar" class="map-bar" hidden></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
