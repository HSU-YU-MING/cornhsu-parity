<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parity Demo — an implementation broken on purpose</title>
<style>
  /* This page deliberately disagrees with design.json, so the demo proves Parity
     reports exact numbers:
     - h1 font-size 30 (design 32); font-family is not Arial (a soft diff)
     - cta-button background #3B82F6 (design #2563EB); left/right padding 8 (design 20)
     - feature-list gap 16 (design 24)
     - the design has a hero-badge this page never implemented -> unmatched */
  * { box-sizing: border-box; margin: 0; }
  body { width: 800px; padding: 40px; font-family: Arial, sans-serif; background: #FFFFFF; }
  h1.page-title {
    font-family: "Segoe UI", sans-serif;   /* design says Arial -> soft diff */
    font-size: 30px;                        /* design 32 -> diff */
    font-weight: 700;
    color: #111827;
    margin-bottom: 16px;
  }
  p.subtitle { font-size: 16px; color: #6B7280; margin-bottom: 32px; }
  button.cta {
    display: block;
    width: 160px; height: 48px;
    padding: 12px 8px;                      /* design 12px 20px -> horizontal padding diff */
    background: #3B82F6;                    /* design #2563EB -> color diff */
    color: #FFFFFF;
    border: none; border-radius: 8px;
    font-size: 16px; font-weight: 600; font-family: Arial, sans-serif;
    margin-bottom: 40px;
  }
  section.feature-list {
    display: flex;
    gap: 16px;                              /* design itemSpacing 24 -> diff */
    width: 720px;
  }
  .feature-card {
    width: 224px; height: 120px;
    padding: 16px;
    background: #F3F4F6;
    border-radius: 12px;
  }
  .feature-card h3 { font-size: 18px; font-weight: 600; color: #111827; }
  /* The design's hero-badge IS implemented here, but the class name does not line up
     and there is no text to anchor on -> automatic matching cannot find it.
     This is what `parity map` is for: click the layer, click the element. */
  .pill {
    position: absolute; top: 40px; left: 640px;
    width: 120px; height: 32px;
    background: #DCFCE7; border-radius: 16px;
  }
</style>
</head>
<body>
  <h1 class="page-title">Parity Demo</h1>
  <p class="subtitle">Property-level design fidelity checking</p>
  <button class="cta" data-parity="cta-button"><span>Get Started</span></button>
  <section class="feature-list">
    <div class="feature-card" id="feature-card-1"><h3>Numeric comparison</h3></div>
    <div class="feature-card" id="feature-card-2"><h3>Local first</h3></div>
    <div class="feature-card" id="feature-card-3"><h3>Gates your CI</h3></div>
  </section>
  <!-- The hero-badge implementation: the name does not match -> unmatched,
       resolved by hand with `parity map`. -->
  <div class="pill"></div>
</body>
</html>
