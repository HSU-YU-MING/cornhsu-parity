version: 2

# 為什麼需要:這個 repo 的 csproj 裡有數個「手工釘住已修補版本」的相依
# (SQLitePCLRaw pin 到 3.0.5 以蓋掉 EF Sqlite 傳遞進來的 NU1903 高風險版本)。
# 那些 pin 現在完全靠人記得回頭看。dependabot 讓「有新的修補版了」變成一則 PR,
# 而不是下一次 restore 時才在 audit 警告裡被發現。
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # 同一版本線的相依一起升,避免一次開五個彼此相關的 PR
      microsoft:
        patterns: ["Microsoft.*", "System.*"]

    ignore:
      # ImageSharp 的 major 升級是主動決定,不是自動升級:Parity 靠解碼出來的像素取色,
      # 升了要重新比對新舊版的像素,量測結果可能跟著變。3.x 內的升級照常(授權金鑰在
      # src/Parity.Engine/sixlabors.lic,見 CLAUDE.md)。
      # 只有 ImageDesignSource.cs 用到它,而且只用 Image.LoadAsync 與 Rgba32 兩個 API,
      # 真要換掉成本很低 —— 但那是主動決定,不是自動升級。
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
