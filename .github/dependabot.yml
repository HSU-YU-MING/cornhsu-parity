version: 2

# 為什麼需要:這個 repo 的 csproj 裡有數個「手工釘住已修補版本」的相依
# (SQLitePCLRaw pin 到 3.0.3 以蓋掉 EF Sqlite 傳遞進來的 NU1903 高風險版本)。
# 那些 pin 現在完全靠人記得回頭看。dependabot 讓「有新的修補版了」變成一則 PR,
# 而不是下一次 restore 時才在 audit 警告裡被發現。
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # 同一版本線的相依一起升,避免一次開五個彼此相關的 PR
      microsoft:
        patterns: ["Microsoft.*", "System.*"]

    ignore:
      # ImageSharp 4.0 把授權變成建置期強制:沒有 sixlabors.lic / SixLaborsLicenseKey
      # 就直接 error,CI 全紅(實測於 #19)。3.1.x 仍是 Split License,開源專案免費。
      # 只有 ImageDesignSource.cs 用到它,而且只用 Image.LoadAsync 與 Rgba32 兩個 API,
      # 真要換掉成本很低 —— 但那是主動決定,不是自動升級。
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
