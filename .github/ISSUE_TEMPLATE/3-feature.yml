name: Feature suggestion
description: Something Parity should do that it doesn't — a property it should compare, a design source, a workflow it should fit into.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some things are declined on purpose (for example, a cloud service that scans public
        URLs) — the reasoning is in ROADMAP.md. Suggestions about them are still welcome if
        something has changed.

        Write in English or 中文, whichever is easier.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Parity get in the way or fall short today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you imagine it working — a flag, a config field, a report section, an Action input…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Workarounds, other tools, manual steps.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Measurement / matching"
        - "Design sources (Figma, JSON, image, snapshot)"
        - "Reports (Markdown, report.json, PR comment)"
        - "CLI / config"
        - "GitHub Action"
        - "Team dashboard (Parity.Server)"
        - "Other"
    validations:
      required: true
