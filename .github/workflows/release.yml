name: release

on:
  push:
    # 只認三段式版號 tag(v1.2.3)。刻意不用 'v*':移動式 major tag(v1,每個 1.x
    # 發版後前移)也符合 'v*',每次前移都會誤觸發一次注定失敗的 release
    # (tag 守門把「1」對 CHANGELOG 版號擋下,無害但每次一顆紅 X + 失敗通知;
    # 2026-08-26 發 1.0.0 與 1.1.0 時各踩一次,run #27/#29)。
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

# 匿名使用統計(2.1.0 起 parity check 預設會送)整份 workflow 關掉。這裡不是開發版:release 用 tag 的真版號
# (-p:Version=…)建置,接著跑的測試裡有真的 check(CliBrowserTests 對離線示範實跑;runner 上有 Chromium 就會跑),
# 沒有這行就會被當成真實使用送進研究資料。測試行程自己也預設 DO_NOT_TRACK=1
# (tests/Parity.Tests/TestProcessDefaults.cs),這是第二道。
env:
  DO_NOT_TRACK: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 建 GitHub Release
      id-token: write   # Trusted Publishing:GitHub 簽發 OIDC token 與 NuGet 交換臨時金鑰
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # SourceLink 需要完整 git 歷史

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # CHANGELOG 是「推 tag 之前」的版本真相源(README 的 @v pin 與發佈版數都對著它比,
      # 見 scripts/verify-readme-facts.ps1)。這一步把它跟 tag 接起來:兩者不一致就別發。
      # 擋在這裡的代價是「tag 已推、但沒發出去」——刪 tag 重來即可;
      # 相對地,CHANGELOG 沒寫就發到 nuget.org 是沒有反悔機會的。
      - name: Assert CHANGELOG top entry matches the tag
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          top=$(grep -m1 -oE '^## +\[?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$top" != "$v" ]; then
            echo "✗ tag 是 v$v,但 CHANGELOG.md 最上面那個版本是 $top。"
            echo "  先補上 ## $v 的段落(README 的數字也一併跑 scripts/verify-readme-facts.ps1 -Update),再重推 tag。"
            exit 1
          fi
          # 第 15 步要發的 Release 內容就是從這一節抽出來的。抽取放在這裡,是因為這裡還在
          # 「推上 nuget.org 之前」——抽不到就是「標題寫了但底下沒內容」,此時刪 tag 重來還救得回來。
          # CHANGELOG 兩種標題格式都吃:「## 0.12.0」與「## [1.1.0] — 2026-08-07」
          notes=$(awk -v v="$v" '
            /^## / {
              if (found) exit
              line = $0; sub(/^## +\[?/, "", line)
              if (index(line, v) == 1) {
                rest = substr(line, length(v) + 1)
                if (rest !~ /^[0-9.]/) { found = 1; next }
              }
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "✗ CHANGELOG.md 有 ## $v 的標題,但底下沒有內容。"
            echo "  GitHub Release 的內容就是從這一節抽出來的 —— 使用者被要求 pin @v$v 時,"
            echo "  Releases 頁是他們唯一看得到這版改了什麼的地方。把那一節寫完,再重推 tag。"
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
          echo "✓ CHANGELOG 頂端 $top 與 tag 一致,Release 內容已備妥($(printf '%s\n' "$notes" | wc -l) 行)"

      - run: dotnet restore Parity.slnx
      - run: dotnet build Parity.slnx -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}
      - run: dotnet test Parity.slnx -c Release --no-build

      # 每個平台一包:pack 產出指標包 Cornhsu.Parity + 九個平台包 Cornhsu.Parity.<rid>。
      # 不能再帶 --no-build:平台包要各自以 RuntimeIdentifier 建置,上面的 dotnet build 沒有建那九份,
      # 帶 --no-build 會 MSB3030(找不到 bin/Release/net10.0/<rid>/parity.runtimeconfig.json,實測)。
      # 只 pack CLI:它是唯一可打包的專案。
      - name: Pack (pointer package + one package per platform)
        env:
          PARITY_VERSION: ${{ steps.ver.outputs.version }}
        run: dotnet pack src/Parity.Cli/Parity.Cli.csproj -c Release -p:Version="$PARITY_VERSION" -o ./artifacts

      # pack 綠不代表包是對的(0.9.1):推之前確認每個平台包只帶自己平台的 Node 與 SQLite、指標包列齊九個平台、
      # 每包都在 nuget.org 250 MB 上限之內。tag 推出去之後才發現就只能刪 tag 重來,但總比發出壞包好。
      - name: Verify the packages before pushing
        env:
          PARITY_VERSION: ${{ steps.ver.outputs.version }}
        run: python3 scripts/verify-tool-packages.py ./artifacts "$PARITY_VERSION" --summary "$GITHUB_STEP_SUMMARY" --title "NuGet packages"

      # Trusted Publishing:用 GitHub OIDC 向 nuget.org 換一把只活 1 小時的臨時金鑰,
      # 不需保管長效 API key、也不需 repo secret(需先在 nuget.org 設定 trusted publisher policy)。
      # 每個平台一包多了九個新的套件 ID:policy 的範圍(Scope 的 glob 與「可否建立新套件」)要涵蓋
      # Cornhsu.Parity.*,第一次發佈前由維護者到 nuget.org 確認。
      - name: NuGet login (OIDC → temp API key, platform packages)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0(v1 當時所指的 commit)
        id: login
        with:
          user: Cornhsu   # nuget.org 使用者名稱(不是 email)

      # 順序是重點:使用者裝的是指標包,指標包先上架而平台包還沒好的那段時間,所有安裝都會失敗。
      # 所以平台包先推 → 等到 nuget.org 真的查得到 → 指標包最後推(細節見 scripts/push-tool-packages.sh)。
      # 發到一半失敗:指標包還沒推,使用者照樣裝到上一版;直接重跑這個 job(--skip-duplicate 略過已上架的)。
      - name: Push platform packages
        env:
          PARITY_VERSION: ${{ steps.ver.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: scripts/push-tool-packages.sh platform "$PARITY_VERSION" ./artifacts

      # nuget.org 收到之後還要驗證、建索引(2.1.0 的 243 MB 包等了半小時以上)。腳本自己 120 分鐘逾時。
      - name: Wait until nuget.org serves every platform package
        timeout-minutes: 125
        env:
          PARITY_VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/push-tool-packages.sh wait "$PARITY_VERSION" ./artifacts

      # 上面那把臨時金鑰只活 1 小時,等驗證可能就超過了:推指標包前重新換一把(一個 OIDC token 只能換一次)
      - name: NuGet login again (pointer package)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0(v1 當時所指的 commit)
        id: login_pointer
        with:
          user: Cornhsu

      - name: Push the pointer package (what users install)
        env:
          PARITY_VERSION: ${{ steps.ver.outputs.version }}
          NUGET_API_KEY: ${{ steps.login_pointer.outputs.NUGET_API_KEY }}
        run: scripts/push-tool-packages.sh pointer "$PARITY_VERSION" ./artifacts

      # 建 GitHub Release。Marketplace 的版本呈現綁 Release,而使用者被要求 pin @vX.Y.Z 時,
      # Releases 頁是他們唯一看得到「這版改了什麼」的地方 —— 先前四個 repo 幾乎都是空的。
      # 內容直接取自 CHANGELOG 對應那一節,不另外手寫一份(單一事實來源)。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          # 內容在「Assert CHANGELOG top entry matches the tag」那一步就抽好了,這裡只負責發。
          # 抽取刻意不放在這裡:這一步跑到的時候套件已經推上 nuget.org,不可逆了——
          # 那時才發現 CHANGELOG 那一節是空的,失敗也救不回任何東西,只會變成「套件出去了但沒有 Release」。
          notes_file="$RUNNER_TEMP/release-notes.md"
          [ -s "$notes_file" ] || { echo "✗ 找不到前面備妥的 Release 內容:$notes_file"; exit 1; }
          # 冪等:重跑 job 時改成更新既有 Release,而不是報錯
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release edit "v$v" --notes-file "$notes_file"
            echo "✔ 已更新既有 Release v$v"
          else
            gh release create "v$v" --title "v$v" --notes-file "$notes_file" --verify-tag
            echo "✔ 已建立 Release v$v"
          fi

  # ── npm 通路 ──
  # 目標使用者(前端 / 設計 QA)電腦裡有 Node、不一定有 .NET,
  # `dotnet tool install` 是真實的採用門檻。這個 job 讓他們可以 `npx cornhsu-parity`。
  #
  # 刻意與上面的 release job 完全獨立:npm 是新通路,NuGet 是現行主力,
  # npm 這邊出問題不該連帶讓 NuGet 發布失敗(needs 只等它成功,不共用 step)。
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm 信任發布:GitHub 簽發 OIDC token,npm 換短效金鑰並自動簽 provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # 刻意不設 registry-url:它會在 .npmrc 寫一行
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,而 OIDC 情境下
      # 該變數不存在 → npm 會拿「空 token」去驗證而不改走 OIDC,直接發布失敗
      # (actions/setup-node#1551)。預設 registry 本來就是 npmjs.org,不需要設。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # 信任發布需要 npm CLI >= 11.5.1;Node 22 內建的是 10.x
      - name: Upgrade npm (trusted publishing 需要 >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 四個平台各自 self-contained 發佈。
      # PlaywrightPlatform 指定單一平台:預設的 'all' 會把五個平台的 driver 全帶上,
      # 但每個 npm 平台包只服務一個平台,帶其他平台的純屬浪費。
      # 註:win-arm64 在 Playwright 1.61 沒有對應的 driver node,PlaywrightPlatform 會落回 'all'
      # (帶全部平台的 node)。無妨——prepare.mjs 一律刪掉 .playwright/node、改用使用者現成的 Node,
      # 所以最終 npm 包不受影響,只是這步多下載了隨即被刪的檔案。
      # linux-arm64 的**實機執行**由下方 smoke-arm64 job 在真 arm64 runner 上驗(win-arm64 無 GitHub
      # 代管 runner,仍只 build-check)。
      - name: Publish binaries (6 RIDs)
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "::group::publish $rid"
            dotnet publish src/Parity.Cli/Parity.Cli.csproj \
              -c Release -r "$rid" --self-contained true \
              -p:Version=${{ steps.ver.outputs.version }} \
              -p:PlaywrightPlatform="$rid" \
              -o "artifacts/publish/$rid"
            echo "::endgroup::"
          done

      # 組裝 npm 套件:刪掉 Playwright 自帶的 Node(win-x64 單檔 88 MB,
      # 而 npm 使用者本來就有 Node —— 啟動腳本會把 PLAYWRIGHT_NODEJS_PATH
      # 指向 process.execPath)。實測可讓平台包從 218 MB 降到 129 MB。
      - name: Assemble npm packages
        run: node npm/prepare.mjs "${{ steps.ver.outputs.version }}" artifacts/publish

      # 煙霧測試:只有 linux-x64 能在此 runner 上直接執行。
      # 至少確保「拿掉自帶 Node 之後執行檔仍可啟動」這件事在 CI 有守到。
      - name: Smoke test (linux-x64)
        run: |
          set -euo pipefail
          BIN=npm/dist/parity-linux-x64/bin/parity
          chmod +x "$BIN"
          PLAYWRIGHT_NODEJS_PATH="$(command -v node)" "$BIN" --help > /dev/null
          echo "✔ linux-x64 執行檔可啟動"

      # 信任發布(OIDC):不帶任何 token。
      # 上方的 id-token: write 讓 GitHub 簽發 OIDC token,npm CLI 自動拿它換一把
      # 短效發布金鑰 —— 與 NuGet 那條線同精神,repo 內零長效金鑰。
      # 注意:NODE_AUTH_TOKEN 連「設成空字串」都不行,npm 會拿空 token 去驗證
      # 而不改走 OIDC,所以這裡完全不設 env。
      # provenance 也不必再加旗標,信任發布會自動產生與簽署。
      #
      # 順序是重點:使用者裝的是入口套件,平台子套件是它的選用相依。入口套件先上架、子套件還沒好的那段時間,
      # npm 不報錯、默默跳過,裝完一執行才 exit 2,npx 還會把半成品留在快取(2.3.1 的 win32-x64 有一小時裝不起來)。
      # 所以子套件先發 → 等到壓縮檔真的下載得到 → 入口套件最後發(細節見 scripts/publish-npm-packages.sh)。
      # 逾時或失敗:入口套件還沒發,使用者照樣裝到上一版;晚一點重跑這個 job(已發佈的會跳過)。
      # 守門排在所有發佈動作之前,失敗時一包都還沒出去。
      # 兩件事讓這個守門有必要(都是 PolyMigrate 2.1.0 實際踩到的):
      #   - NPM_TOKEN 這類 secret 平常是休眠的,但只要有人加了同名的,npm 就會安靜地
      #     繞過信任發布、回到長效金鑰——發得出去,但 repo 從此有一把長效金鑰在流通。
      #   - token 認證和 provenance 互斥:workflow 有 id-token: write 時 npm 會自動嘗試簽
      #     provenance,認證若走 token,憑證申請就 403(CA_CREATE_SIGNING_CERTIFICATE_ERROR)。
      - name: Refuse to publish with an npm token
        run: |
          set -uo pipefail
          # 只看有沒有,不印出內容
          for v in $(compgen -e); do
            case "${v,,}" in
              npm_token|node_auth_token|npm_config_*auth*)
                echo "::error::環境變數 $v 看起來是 npm token;npm 只走 OIDC 信任發布,請拿掉它"
                exit 1 ;;
            esac
          done
          for f in ~/.npmrc .npmrc "${NPM_CONFIG_USERCONFIG:-}"; do
            if grep -qs '_auth' "$f"; then
              echo "::error::$f 裡有 npm 認證設定(_auth / _authToken);npm 只走 OIDC 信任發布,請拿掉它"
              exit 1
            fi
          done
          echo "認證:OIDC 信任發布"

      - name: Publish the npm platform packages (OIDC trusted publishing)
        run: bash scripts/publish-npm-packages.sh platform npm/dist

      # 2.3.0、2.3.1 實測:發佈後 8 分鐘到超過 1.5 小時不等,每個平台不一樣。腳本自己 180 分鐘逾時,全部好了之後隔 5 分鐘再確認一次。
      - name: Wait until npm serves every platform package
        timeout-minutes: 190
        run: bash scripts/publish-npm-packages.sh wait npm/dist

      - name: Publish the npm entry package (what users install)
        timeout-minutes: 190
        run: bash scripts/publish-npm-packages.sh entry npm/dist

  # ── arm64 實機煙霧測試 ──
  # release/npm 的 arm64 執行檔是在 x64 runner 上交叉建置的:建得出來 ≠ 跑得動。
  # 這個 job 在**真的 arm64 runner**(GitHub 代管的 ubuntu-24.04-arm)上原生建 linux-arm64
  # 並跑 `parity --help`,證明它真的能執行。刻意獨立、不 gate 發布(arm64 是次要平台,且
  # npm 冪等發布可事後補救);紅了就知道 arm64 壞了要查。--help 不開瀏覽器,不需要 node。
  smoke-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish & run linux-arm64 (--help)
        run: |
          set -euo pipefail
          dotnet publish src/Parity.Cli/Parity.Cli.csproj \
            -c Release -r linux-arm64 --self-contained true \
            -o artifacts/arm64-smoke
          artifacts/arm64-smoke/parity --help > /dev/null
          echo "✔ linux-arm64 執行檔在真 arm64 上可執行"
