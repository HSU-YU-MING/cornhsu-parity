name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# CI 只讀原始碼,不需要任何寫入權限。明確寫死最小權限,不吃 repo 的預設值。
permissions:
  contents: read

# 匿名使用統計(2.1.0 起 parity check 預設會送)整份 workflow 關掉:單元測試(CliBrowserTests)與離線示範跑的
# 都是真的 check,維護者自己的 CI 不能混進研究資料。從原始碼建的 0.0.0-dev 本來就不送,這是第二道;
# pack-smoke 裝的 0.0.0-ci 不算開發版,只靠這一行(它現在只跑 --help)。
env:
  DO_NOT_TRACK: '1'

jobs:
  # 排版守門(對齊 PolyMigrate 的 CI 形狀)。風格規則見 .editorconfig。
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format Parity.slnx --verify-no-changes

  # 這個工具是給「各平台的 CI」用的,自己就得證明在各平台建得起來、跑得動。
  # 0.9.1 的教訓:在 ubuntu 上 pack 出來的包,Windows 使用者裝了直接 Driver not found。
  # 只在 ubuntu 建置看不出這種事,所以這裡明確跑三個 OS 的建置與單元測試。
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Parity.slnx -c Release

  # 打包 + 真的把工具裝起來跑一次 --help。
  # `dotnet pack` 成功不代表裝得起來:Playwright driver 的平台檔案要真的進到包裡,
  # 而那件事只有「安裝後執行」才驗得到(0.9.1 正是 pack 綠、安裝後才爆)。
  pack-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        run: dotnet pack src/Parity.Cli/Parity.Cli.csproj -c Release -p:Version=0.0.0-ci -o nupkg
      - name: Install the packed tool and run it
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global --add-source ./nupkg --version 0.0.0-ci Cornhsu.Parity
          export PATH="$HOME/.dotnet/tools:$PATH"
          parity --help > /dev/null
          echo "✓ 打包出來的工具在 ${{ matrix.os }} 上裝得起來也跑得動"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: nupkg/*.nupkg

  # ── 【實驗】每個平台一包(ToolPackageRuntimeIdentifiers)──
  # 單一套件約 243 MB,離 nuget.org 250 MB 上限只剩幾 MB。這組 job 回答「改成指標包 + 六個平台包可不可行」:
  #   rid-pack     在 ubuntu 上 pack(跟 release 同一個環境),驗套件形狀、量大小,順便打包比較組
  #   rid-install  六個平台各在真機上:用 action.yml 的方式安裝、--version/--help、install-browser、真的跑一次 check
  #   rid-compat   .NET 8/9 SDK 與最早的 10.0.100:新舊兩種套件各裝一次,確認「現在裝得起來的,改了還裝得起來」
  #   rid-musl     Alpine(linux-musl-x64,不在清單裡的平台):裝起來會怎樣
  # 結論與數字在 PR 說明;定案後這組 job 要嘛收斂進 pack-smoke,要嘛整組拿掉。
  rid-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: SDK version
        run: echo "SDK $(dotnet --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack — one package per platform (framework-dependent, the prototype's default)
        run: dotnet pack src/Parity.Cli/Parity.Cli.csproj -c Release -p:Version=0.0.0-ci -o out/fd
      - name: Verify the packages
        run: python3 scripts/verify-tool-packages.py out/fd 0.0.0-ci --summary "$GITHUB_STEP_SUMMARY" --title "每個平台一包:framework(依賴使用者的 .NET 10,雛形預設)"

      # 每次換形式前清掉 bin/obj:pack 是把 publish 資料夾整個收進去,上一種形式留下的檔案會混進下一種
      - name: Pack — one package per platform (self-contained, for comparison)
        run: |
          git clean -xdfq src
          dotnet pack src/Parity.Cli/Parity.Cli.csproj -c Release -p:Version=0.0.0-ci.sc -p:ParityToolDeployment=self-contained -o out/sc
      - name: Verify the packages (self-contained)
        run: python3 scripts/verify-tool-packages.py out/sc 0.0.0-ci.sc --form self-contained --summary "$GITHUB_STEP_SUMMARY" --title "每個平台一包:self-contained(自帶 .NET runtime)"

      # 比較組:同一個 commit 打出「現在的單一套件」(把平台清單清空,SDK 就退回原本的單包形狀)
      - name: Pack — today's single package from the same commit (size baseline)
        run: |
          git clean -xdfq src
          dotnet pack src/Parity.Cli/Parity.Cli.csproj -c Release -p:Version=0.0.0-ci.legacy -p:RuntimeIdentifiers= -p:ToolPackageRuntimeIdentifiers= -o out/legacy
          python3 scripts/verify-tool-packages.py --sizes out/legacy/Cornhsu.Parity.0.0.0-ci.legacy.nupkg --summary "$GITHUB_STEP_SUMMARY" --title "比較組:現在的單一套件(同一個 commit)"

      # Alpine 的緩解候選:多兩個 musl 平台包與一個 any 後備包,三者都不帶 Playwright 的 Node(csproj 設 none)
      - name: Pack — platform list plus linux-musl-x64, linux-musl-arm64 and any (Alpine mitigation candidate)
        run: |
          git clean -xdfq src
          sed -i 's|<RuntimeIdentifiers>win-x64;win-arm64;linux-x64;linux-arm64;osx-x64;osx-arm64</RuntimeIdentifiers>|<RuntimeIdentifiers>win-x64;win-arm64;linux-x64;linux-arm64;osx-x64;osx-arm64;linux-musl-x64;linux-musl-arm64;any</RuntimeIdentifiers>|' src/Parity.Cli/Parity.Cli.csproj
          grep -q 'linux-musl-x64;linux-musl-arm64;any' src/Parity.Cli/Parity.Cli.csproj
          dotnet pack src/Parity.Cli/Parity.Cli.csproj -c Release -p:Version=0.0.0-ci.musl -o out/musl
          git checkout -- src/Parity.Cli/Parity.Cli.csproj
          python3 scripts/verify-tool-packages.py --sizes out/musl/*.nupkg --summary "$GITHUB_STEP_SUMMARY" --title "候選:再加 linux-musl-x64 / linux-musl-arm64 / any(都不帶 Node)"

      # release.yml 推套件的腳本對本機資料夾乾跑:確認平台包全推完才推指標包,而且推完裝得起來
      - name: Dry-run the release push order against a local folder feed
        run: |
          set -euo pipefail
          mkdir -p out/feed
          NUGET_API_KEY=dry-run NUGET_SOURCE="$PWD/out/feed" FLAT_CONTAINER='' \
            bash scripts/push-tool-packages.sh all 0.0.0-ci out/fd | tee push.log
          grep -E '^Pushing ' push.log | tail -1 | grep -q 'Pushing Cornhsu.Parity.0.0.0-ci.nupkg' \
            || { echo "✗ 最後推的不是指標包"; exit 1; }
          [ "$(grep -cE '^Pushing ' push.log)" -eq 7 ] || { echo "✗ 應該推 7 個套件"; exit 1; }
          dotnet tool install --tool-path feed-tool --add-source out/feed --version 0.0.0-ci Cornhsu.Parity
          feed-tool/parity --version
          echo "✓ 推送順序正確(六個平台包 → 指標包),推完裝得起來"

      # nupkg 本來就壓縮過,上傳不再壓;只留 3 天,夠下游 job 用就好
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rid-fd
          path: out/fd/*.nupkg
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rid-sc
          path: out/sc/*.nupkg
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rid-legacy
          path: out/legacy/*.nupkg
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rid-musl
          path: out/musl/*.nupkg
          compression-level: 0
          retention-days: 3

  # 六個平台各一台真機。套件是 ubuntu 上 pack 的(跟 release 一樣),在這裡用 action.yml 的方式裝
  # (--global + setup-dotnet 10.0.x),再真的開瀏覽器跑一次離線示範,報告計數要跟 build-test 一字不差
  rid-install:
    needs: rid-pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rid-fd
          path: pkgs/fd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rid-sc
          path: pkgs/sc

      - name: Install (framework) the way action.yml does
        run: |
          set -euo pipefail
          dotnet tool install --global --add-source pkgs/fd --version 0.0.0-ci Cornhsu.Parity
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Install (self-contained) into a tool path
        run: dotnet tool install --tool-path sc-tool --add-source pkgs/sc --version 0.0.0-ci.sc Cornhsu.Parity

      - name: The CLI picked this platform's package
        run: |
          set -euo pipefail
          ls "$HOME/.dotnet/tools/.store/cornhsu.parity/0.0.0-ci/" | tee picked-fd.txt
          ls "sc-tool/.store/cornhsu.parity/0.0.0-ci.sc/" | tee picked-sc.txt
          grep -qx 'cornhsu.parity.${{ matrix.rid }}' picked-fd.txt
          grep -qx 'cornhsu.parity.${{ matrix.rid }}' picked-sc.txt
          echo "✓ 兩種形式都裝到 Cornhsu.Parity.${{ matrix.rid }}"

      # 啟動檔的形狀:framework 平台包是 Runner="dotnet",SDK 在 Windows 上產生 parity.exe(跟現在的單一套件一樣,
      # bash 叫得到)。Runner="executable" 的包(self-contained 一定是)在 Windows 上產生的是 parity.cmd 批次檔:
      # PowerShell/cmd 叫得到、bash 叫不到——action.yml 每一步都是 shell: bash。第一輪 CI 就是這樣紅的
      - name: Launcher files the SDK created
        run: |
          set -euo pipefail
          ls -la "$HOME/.dotnet/tools/" sc-tool/
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f "$HOME/.dotnet/tools/parity.exe" || { echo "✗ framework 的啟動檔不是 parity.exe"; exit 1; }
            if [ -f sc-tool/parity.cmd ]; then echo "(紀錄)self-contained 在 Windows 上的啟動檔是 parity.cmd:bash 叫不到"; fi
          fi

      - name: --version and --help (bash, the way action.yml runs parity)
        run: |
          set -euo pipefail
          parity --version
          parity --help > /dev/null
          if [ "$RUNNER_OS" != "Windows" ]; then
            sc-tool/parity --version
            sc-tool/parity --help > /dev/null
          fi

      - name: --version (Windows PowerShell, both forms)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:USERPROFILE\.dotnet\tools\parity.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & .\sc-tool\parity.cmd --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Chromium
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then parity install-browser --with-deps; else parity install-browser; fi

      # 計數與 build-test 的 jq 斷言相同(沒有 parity.map.json 的 checkout:12 個節點配到 11)。
      # set +e:GitHub 的 bash 預設帶 -e,check 預期的 exit 1 會直接結束這一步(第一輪 CI 踩到)
      - name: Real check on the offline demo (bash)
        run: |
          set +e
          set -uo pipefail
          status=0
          tools="parity"
          if [ "$RUNNER_OS" != "Windows" ]; then tools="$tools sc-tool/parity"; fi
          for tool in $tools; do
            work="$RUNNER_TEMP/demo-$(echo "$tool" | tr '/' '-')"
            rm -rf "$work"; cp -r samples/demo "$work"
            case "$tool" in parity) bin=parity ;; *) bin="$PWD/$tool" ;; esac
            (cd "$work" && "$bin" check --config parity.config.json)
            code=$?
            report="$work/.parity/report.json"
            if [ "$code" -ne 1 ]; then echo "✗ $tool:預期 exit 1(GATE FAIL),實際 $code"; status=1; continue; fi
            if jq -e '(.reports | length) == 1
                and (.reports[0].summary | .designNodes == 12 and .matched == 11 and .unmatched == 1
                     and .nodesWithDiffs == 3 and .critical == 0 and .serious == 5 and .medium == 0 and .minor == 1)
                and ([.reports[0].nodes[].diffs[] | select(.soft)] | length) == 1' "$report" > /dev/null; then
              echo "✓ $tool:check 開了瀏覽器、寫出報告,計數正確"
            else
              echo "✗ $tool:報告計數與預期不符"; jq '.reports[0].summary' "$report"; status=1
            fi
          done
          exit $status

      # Windows 的 self-contained 只能從 PowerShell/cmd 叫(parity.cmd);順便確認批次檔有把 exit code 原樣傳出來
      - name: Real check, self-contained through parity.cmd (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'demo-sc-pwsh'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          Copy-Item -Recurse samples/demo $work
          $bin = (Resolve-Path .\sc-tool\parity.cmd).Path
          Push-Location $work
          & $bin check --config parity.config.json
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 1) { Write-Host "✗ 預期 exit 1(GATE FAIL),實際 $code"; exit 1 }
          $summary = (Get-Content (Join-Path $work '.parity/report.json') -Raw | ConvertFrom-Json).reports[0].summary
          if ($summary.designNodes -ne 12 -or $summary.matched -ne 11 -or $summary.serious -ne 5 -or $summary.minor -ne 1) {
            Write-Host "✗ 報告計數與預期不符"; $summary | Format-List; exit 1
          }
          Write-Host "✓ self-contained(parity.cmd)在 PowerShell 裡 check 成功,exit code 1 原樣傳出"

  # 舊 SDK:新舊兩種套件都裝一次。關心的不是「舊 SDK 能不能裝」,而是「新形式有沒有比現在更挑 SDK」
  rid-compat:
    needs: rid-pack
    strategy:
      fail-fast: false
      matrix:
        sdk: ['8.0.x', '9.0.x', '10.0.100']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: sdk
        with:
          dotnet-version: ${{ matrix.sdk }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rid-fd
          path: pkgs/fd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rid-legacy
          path: pkgs/legacy
      - name: Install both layouts with exactly this SDK
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.dotnet-version }}
        run: |
          set -uo pipefail
          # runner 上預裝了好幾版 SDK;global.json 鎖死成剛裝的這一版,不讓它往上滾
          mkdir -p work && cd work
          printf '{"sdk":{"version":"%s","rollForward":"disable"}}\n' "$SDK_VERSION" > global.json
          echo "SDK in use: $(dotnet --version)"
          result() {
            local name="$1" src="$2" ver="$3"
            if dotnet tool install --tool-path "tool-$name" --add-source "../pkgs/$src" --version "$ver" Cornhsu.Parity > "install-$name.log" 2>&1 \
               && "tool-$name/parity" --version > /dev/null 2>&1; then
              echo ok
            else
              echo fail
            fi
          }
          legacy=$(result legacy legacy 0.0.0-ci.legacy)
          rid=$(result rid fd 0.0.0-ci)
          tail -n 3 install-legacy.log install-rid.log
          echo "| SDK $(dotnet --version) | 現在的單一套件:$legacy | 每個平台一包:$rid |" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.sdk }}" = "10.0.100" ]; then
            if [ "$legacy" != ok ] || [ "$rid" != ok ]; then echo "✗ 最早的 .NET 10 SDK 應該兩種都裝得起來"; exit 1; fi
          elif [ "$legacy" != "$rid" ]; then
            echo "✗ 新形式在這版 SDK 的結果跟現在不同:回歸"; exit 1
          fi

  # 不在平台清單裡的平台會怎樣:用 Alpine(linux-musl-x64)實測三種套件
  rid-musl:
    needs: rid-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rid-fd
          path: pkgs/fd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rid-legacy
          path: pkgs/legacy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rid-musl
          path: pkgs/musl
      - name: Install and run on Alpine
        run: |
          set -euo pipefail
          cat > musl-test.sh <<'EOF'
          set -u
          export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DO_NOT_TRACK=1
          echo "SDK $(dotnet --version) on $(dotnet --info | grep -m1 'RID:' | awk '{print $2}')"
          for spec in legacy:0.0.0-ci.legacy fd:0.0.0-ci musl:0.0.0-ci.musl; do
            name=${spec%%:*}; ver=${spec#*:}
            mkdir -p /w/$name && cd /w/$name
            printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear/><add key="local" value="/pkgs/%s"/></packageSources></configuration>' "$name" > nuget.config
            if dotnet tool install --tool-path tool Cornhsu.Parity --version "$ver" > install.log 2>&1; then install=ok; else install=fail; fi
            picked=$(ls tool/.store/cornhsu.parity/$ver/ 2>/dev/null | grep -E '^cornhsu\.parity(\.|$)' | tr '\n' ' ')
            if tool/parity --version > run.log 2>&1; then version=ok; else version="fail($(head -c 120 run.log | tr '\n' ' '))"; fi
            cp -r /demo /w/$name/demo
            if (cd /w/$name/demo && /w/$name/tool/parity lint --config parity.config.json > /w/$name/lint.log 2>&1); [ $? -eq 1 ]; then lint=ok; else lint=fail; fi
            echo "$name|$install|$picked|$version|$lint"
          done
          EOF
          docker run --rm -v "$PWD/pkgs:/pkgs:ro" -v "$PWD/samples/demo:/demo:ro" -v "$PWD/musl-test.sh:/t.sh:ro" \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine sh /t.sh | tee musl.txt
          {
            echo "### Alpine(linux-musl-x64)"
            echo ""
            echo "| 套件 | 安裝 | 裝到的套件 | --version | lint(不開瀏覽器的指令)|"
            echo "|---|---|---|---|---|"
            grep '|' musl.txt | sed 's/^/| /; s/$/ |/'
          } >> "$GITHUB_STEP_SUMMARY"
          # 本機實測(2026-11-04):現在的單一套件能跑不開瀏覽器的指令(check 本來就因為 Playwright 的 Node 是 glibc 版而不能跑);
          # 六個平台包會被配到 linux-x64,因為平台包是 Runner="dotnet"、啟動檔由 Alpine 上的 SDK 產生,同樣跑得動
          # (只差在讀既有的 baseline 資料庫:linux-x64 包的 SQLite 原生檔是 glibc 版,本機實測 baseline list exit 2);
          # 加了 musl 平台包就連那一點也一樣。這裡把三件事釘住,SDK 行為一變就會知道
          grep -q '^legacy|ok|cornhsu.parity |ok|ok$' musl.txt
          grep -q '^fd|ok|cornhsu.parity cornhsu.parity.linux-x64 |ok|ok$' musl.txt
          grep -q '^musl|ok|cornhsu.parity cornhsu.parity.linux-musl-x64 |ok|ok$' musl.txt
          echo "✓ Alpine 的三種結果與本機實測一致"

  # 網頁外殼前端(web/ → Parity.Server wwwroot)。tsc --noEmit 含在 build script 裡,
  # 型別錯誤就紅——伺服器端 API 形狀改了而前端型別沒跟上時,這裡會先叫。
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # 前端的純函式(例如 Figma 深連結的解析)用 Node 內建 test runner 跑,不另裝測試框架
      - run: npm test
        working-directory: web

  # 部署映像(網頁外殼 M5):建得起來、以非 root 起得來、/healthz 回 ok、前端有被打包進去、
  # 管理指令在容器裡寫得進 /data。維護者的開發機沒有 Docker,Dockerfile 只在這裡被實際驗證
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the server image
        run: docker build -t parity-server:ci .
      - name: Start it and probe it
        run: |
          set -euo pipefail
          docker run -d --name parity -p 8080:8080 parity-server:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec parity dotnet Parity.Server.dll create-project ci-smoke | grep -q "project created: ci-smoke"
          # 鐵則的實體化:映像裡不能有瀏覽器或引擎
          if docker exec parity sh -c 'ls /app | grep -iE "playwright|Parity\.Engine|ImageSharp"'; then
            echo "the server image contains browser or engine assemblies"; exit 1
          fi
      - name: Server log
        if: always()
        run: docker logs parity 2>&1 | tail -50

  build-test:
    name: Build + Test + Parity 自我把關
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Parity.slnx -c Release

      # 用剛建好的工具本身裝瀏覽器(順便 dogfood --with-deps)。
      # 刻意排在單元測試**之前**:SettleCaptureTests 需要真實瀏覽器,沒裝會自己略過——
      # 那條測的是量測正確性,靜靜略過等於沒驗。
      - name: Install Chromium (with system deps)
        run: dotnet run --project src/Parity.Cli -c Release --no-build -- install-browser --with-deps

      - name: Unit tests
        run: dotnet test Parity.slnx -c Release --no-build

      # README 的數字會走鐘:v0.13.1 當下就已經寫著「195 條測試」而實際是 197。
      # 加測試的人不會想到 README,所以讓 CI 自己數一次再比(測試數 / 發佈版數 / @v pin,
      # 兩份 README 一起)。不一致時跑 `pwsh scripts/verify-readme-facts.ps1 -Update` 重貼。
      # 刻意只在 ubuntu 跑一次、不進 matrix:三個 OS 比同一份文字只會多三倍換行與 locale 的雜訊。
      - name: Verify README facts
        run: pwsh scripts/verify-readme-facts.ps1 -NoBuild

      # 離線示範刻意做壞 → 預期 GATE FAIL(exit 1)。這正是 CI 把關該有的行為,
      # 所以「跑出 exit 1」= 成功;跑出別的才是回歸。
      # 只看退出碼不夠(XamlContrast 的 ci.yml 同一個形狀):再用 jq 驗報告計數,
      # 「工具真的會擋」與「擋的數量沒有莫名其妙變動」一起驗——配對規則或量測一改,這裡立刻紅。
      # 計數以「沒有 parity.map.json 的 checkout」為準(map 檔刻意不進版控):12 個設計節點配到 11、
      # 1 個未配對(hero-badge);3 個節點有落差,共 5 條 serious + 1 條 minor(font-family,soft)。
      # 本機跑過 `parity map` 的話會是 12/12,與這裡不同是正常的。
      # 這組數字也被 CliBrowserTests 對著 demo 的乾淨複本實跑比對,改數字前先確認那條測試。
      - name: Parity check (offline demo, 預期 GATE FAIL)
        run: |
          set +e
          dotnet run --project src/Parity.Cli -c Release --no-build -- \
            check --config samples/demo/parity.config.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "✗ 預期 exit 1(GATE FAIL),實際為 $code"
            exit 1
          fi
          echo "✓ 離線示範如預期 GATE FAIL(exit 1)——CI 把關行為正確"
          report=samples/demo/.parity/report.json
          jq -e '(.reports | length) == 1
            and (.reports[0].summary | .designNodes == 12 and .matched == 11 and .unmatched == 1
                 and .nodesWithDiffs == 3 and .critical == 0 and .serious == 5 and .medium == 0 and .minor == 1)
            and ([.reports[0].nodes[].diffs[] | select(.soft)] | length) == 1' \
            "$report" > /dev/null \
            || { echo "✗ demo 報告計數與預期不符"; jq '.reports[0].summary' "$report"; exit 1; }
          echo "✓ demo 報告計數正確"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: samples/demo/.parity/report.json
          if-no-files-found: ignore
