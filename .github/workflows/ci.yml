name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# CI 只讀原始碼,不需要任何寫入權限。明確寫死最小權限,不吃 repo 的預設值。
permissions:
  contents: read

# 匿名使用統計(2.1.0 起 parity check 預設會送)整份 workflow 關掉:單元測試(CliBrowserTests)與離線示範跑的
# 都是真的 check,維護者自己的 CI 不能混進研究資料。從原始碼建的 0.0.0-dev 本來就不送,這是第二道;
# pack-smoke 裝的 0.0.0-ci 不算開發版,只靠這一行(它現在只跑 --help)。
env:
  DO_NOT_TRACK: '1'

jobs:
  # 排版守門(對齊 PolyMigrate 的 CI 形狀)。風格規則見 .editorconfig。
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format Parity.slnx --verify-no-changes

  # 這個工具是給「各平台的 CI」用的,自己就得證明在各平台建得起來、跑得動。
  # 0.9.1 的教訓:在 ubuntu 上 pack 出來的包,Windows 使用者裝了直接 Driver not found。
  # 只在 ubuntu 建置看不出這種事,所以這裡明確跑三個 OS 的建置與單元測試。
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Parity.slnx -c Release

  # 打包 + 真的把工具裝起來跑一次 --help。
  # `dotnet pack` 成功不代表裝得起來:Playwright driver 的平台檔案要真的進到包裡,
  # 而那件事只有「安裝後執行」才驗得到(0.9.1 正是 pack 綠、安裝後才爆)。
  pack-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        run: dotnet pack src/Parity.Cli/Parity.Cli.csproj -c Release -p:Version=0.0.0-ci -o nupkg
      - name: Install the packed tool and run it
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global --add-source ./nupkg --version 0.0.0-ci Cornhsu.Parity
          export PATH="$HOME/.dotnet/tools:$PATH"
          parity --help > /dev/null
          echo "✓ 打包出來的工具在 ${{ matrix.os }} 上裝得起來也跑得動"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: nupkg/*.nupkg

  # 網頁外殼前端(web/ → Parity.Server wwwroot)。tsc --noEmit 含在 build script 裡,
  # 型別錯誤就紅——伺服器端 API 形狀改了而前端型別沒跟上時,這裡會先叫。
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # 前端的純函式(例如 Figma 深連結的解析)用 Node 內建 test runner 跑,不另裝測試框架
      - run: npm test
        working-directory: web

  # 部署映像(網頁外殼 M5):建得起來、以非 root 起得來、/healthz 回 ok、前端有被打包進去、
  # 管理指令在容器裡寫得進 /data。維護者的開發機沒有 Docker,Dockerfile 只在這裡被實際驗證
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the server image
        run: docker build -t parity-server:ci .
      - name: Start it and probe it
        run: |
          set -euo pipefail
          docker run -d --name parity -p 8080:8080 parity-server:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec parity dotnet Parity.Server.dll create-project ci-smoke | grep -q "project created: ci-smoke"
          # 鐵則的實體化:映像裡不能有瀏覽器或引擎
          if docker exec parity sh -c 'ls /app | grep -iE "playwright|Parity\.Engine|ImageSharp"'; then
            echo "the server image contains browser or engine assemblies"; exit 1
          fi
      - name: Server log
        if: always()
        run: docker logs parity 2>&1 | tail -50

  build-test:
    name: Build + Test + Parity 自我把關
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Parity.slnx -c Release

      # 用剛建好的工具本身裝瀏覽器(順便 dogfood --with-deps)。
      # 刻意排在單元測試**之前**:SettleCaptureTests 需要真實瀏覽器,沒裝會自己略過——
      # 那條測的是量測正確性,靜靜略過等於沒驗。
      - name: Install Chromium (with system deps)
        run: dotnet run --project src/Parity.Cli -c Release --no-build -- install-browser --with-deps

      - name: Unit tests
        run: dotnet test Parity.slnx -c Release --no-build

      # README 的數字會走鐘:v0.13.1 當下就已經寫著「195 條測試」而實際是 197。
      # 加測試的人不會想到 README,所以讓 CI 自己數一次再比(測試數 / 發佈版數 / @v pin,
      # 兩份 README 一起)。不一致時跑 `pwsh scripts/verify-readme-facts.ps1 -Update` 重貼。
      # 刻意只在 ubuntu 跑一次、不進 matrix:三個 OS 比同一份文字只會多三倍換行與 locale 的雜訊。
      - name: Verify README facts
        run: pwsh scripts/verify-readme-facts.ps1 -NoBuild

      # 離線示範刻意做壞 → 預期 GATE FAIL(exit 1)。這正是 CI 把關該有的行為,
      # 所以「跑出 exit 1」= 成功;跑出別的才是回歸。
      # 只看退出碼不夠(XamlContrast 的 ci.yml 同一個形狀):再用 jq 驗報告計數,
      # 「工具真的會擋」與「擋的數量沒有莫名其妙變動」一起驗——配對規則或量測一改,這裡立刻紅。
      # 計數以「沒有 parity.map.json 的 checkout」為準(map 檔刻意不進版控):12 個設計節點配到 11、
      # 1 個未配對(hero-badge);3 個節點有落差,共 5 條 serious + 1 條 minor(font-family,soft)。
      # 本機跑過 `parity map` 的話會是 12/12,與這裡不同是正常的。
      # 這組數字也被 CliBrowserTests 對著 demo 的乾淨複本實跑比對,改數字前先確認那條測試。
      - name: Parity check (offline demo, 預期 GATE FAIL)
        run: |
          set +e
          dotnet run --project src/Parity.Cli -c Release --no-build -- \
            check --config samples/demo/parity.config.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "✗ 預期 exit 1(GATE FAIL),實際為 $code"
            exit 1
          fi
          echo "✓ 離線示範如預期 GATE FAIL(exit 1)——CI 把關行為正確"
          report=samples/demo/.parity/report.json
          jq -e '(.reports | length) == 1
            and (.reports[0].summary | .designNodes == 12 and .matched == 11 and .unmatched == 1
                 and .nodesWithDiffs == 3 and .critical == 0 and .serious == 5 and .medium == 0 and .minor == 1)
            and ([.reports[0].nodes[].diffs[] | select(.soft)] | length) == 1' \
            "$report" > /dev/null \
            || { echo "✗ demo 報告計數與預期不符"; jq '.reports[0].summary' "$report"; exit 1; }
          echo "✓ demo 報告計數正確"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: samples/demo/.parity/report.json
          if-no-files-found: ignore
