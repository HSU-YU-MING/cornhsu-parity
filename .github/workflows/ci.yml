name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# CI 只讀原始碼,不需要任何寫入權限。明確寫死最小權限,不吃 repo 的預設值。
permissions:
  contents: read

# 匿名使用統計(2.1.0 起 parity check 預設會送)整份 workflow 關掉:單元測試(CliBrowserTests)、離線示範與 install-smoke
# 跑的都是真的 check,維護者自己的 CI 不能混進研究資料。從原始碼建的 0.0.0-dev 與 install-smoke 裝的 0.0.0-ci
# 本來就不送(版號以 0.0.0- 開頭),這是第二道。
env:
  DO_NOT_TRACK: '1'

jobs:
  # 排版守門(對齊 PolyMigrate 的 CI 形狀)。風格規則見 .editorconfig。
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format Parity.slnx --verify-no-changes

  # 這個工具是給「各平台的 CI」用的,自己就得證明在各平台建得起來、跑得動。
  # 0.9.1 的教訓:在 ubuntu 上 pack 出來的包,Windows 使用者裝了直接 Driver not found。
  # 只在 ubuntu 建置看不出這種事,所以這裡明確跑三個 OS 的建置與單元測試。
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Parity.slnx -c Release

  # 打包(在 ubuntu 上,跟 release 同一個環境)、檢查每個包的內容、乾跑一次發版的推送順序。
  # `dotnet pack` 成功不代表包是對的:Playwright driver 的平台檔案要真的進到包裡,
  # 而那件事只有看包的內容或安裝後執行才驗得到(0.9.1 正是 pack 綠、安裝後才爆)。
  # 下游的 install-smoke* 拿這裡打好的包去各平台真的裝。
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        run: dotnet pack src/Parity.Cli/Parity.Cli.csproj -c Release -p:Version=0.0.0-ci -o nupkg
      - name: Verify the packages
        run: python3 scripts/verify-tool-packages.py nupkg 0.0.0-ci --summary "$GITHUB_STEP_SUMMARY" --title "NuGet packages"

      # release.yml 推套件的腳本對本機資料夾乾跑:確認平台包全推完才推指標包,而且推完裝得起來
      - name: Dry-run the release push order against a local folder feed
        run: |
          set -euo pipefail
          mkdir -p feed
          NUGET_API_KEY=dry-run NUGET_SOURCE="$PWD/feed" FLAT_CONTAINER='' \
            bash scripts/push-tool-packages.sh all 0.0.0-ci nupkg | tee push.log
          grep -E '^Pushing ' push.log | tail -1 | grep -q 'Pushing Cornhsu.Parity.0.0.0-ci.nupkg' \
            || { echo "✗ 最後推的不是指標包"; exit 1; }
          [ "$(grep -cE '^Pushing ' push.log)" -eq 10 ] || { echo "✗ 應該推 10 個套件(九個平台包 + 指標包)"; exit 1; }
          dotnet tool install --tool-path feed-tool --add-source feed --version 0.0.0-ci Cornhsu.Parity
          feed-tool/parity --version
          echo "✓ 推送順序正確(九個平台包 → 指標包),推完裝得起來"

      # nupkg 本來就壓縮過,上傳不再壓;只留 3 天,夠下游 job 用就好
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: nupkg/*.nupkg
          compression-level: 0
          retention-days: 3

  # 六個有瀏覽器的平台各一台真機。套件是 ubuntu 上 pack 的(跟 release 一樣),在這裡用 action.yml 的方式裝
  # (--global + setup-dotnet 10.0.x),再真的開瀏覽器跑一次離線示範,報告計數要跟 build-test 一字不差,
  # 基準資料庫也存讀一次:每個平台包只帶自己的 Node 與 SQLite 原生檔,帶錯了只有在那個平台上才看得到。
  install-smoke:
    needs: pack-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: pkgs

      - name: Install the way action.yml does
        run: |
          set -euo pipefail
          dotnet tool install --global --add-source pkgs --version 0.0.0-ci Cornhsu.Parity
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: The CLI picked this platform's package
        run: |
          set -euo pipefail
          ls "$HOME/.dotnet/tools/.store/cornhsu.parity/0.0.0-ci/" | tee picked.txt
          grep -qx 'cornhsu.parity.${{ matrix.rid }}' picked.txt
          echo "✓ 裝到 Cornhsu.Parity.${{ matrix.rid }}"

      # 平台包是 Runner="dotnet",SDK 在 Windows 上產生 parity.exe,bash 叫得到。Runner="executable" 的話是 parity.cmd 批次檔:
      # PowerShell/cmd 叫得到、bash 叫不到——action.yml 每一步都是 shell: bash。實驗時第一輪 CI 就是這樣紅的
      - name: The launcher on Windows is parity.exe
        if: runner.os == 'Windows'
        run: test -f "$HOME/.dotnet/tools/parity.exe" || { echo "✗ 啟動檔不是 parity.exe"; ls -la "$HOME/.dotnet/tools/"; exit 1; }

      - name: --version and --help (bash, the way action.yml runs parity)
        run: |
          set -euo pipefail
          parity --version
          parity --help > /dev/null

      - name: --version (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:USERPROFILE\.dotnet\tools\parity.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Chromium
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then parity install-browser --with-deps; else parity install-browser; fi

      # 計數與 build-test 的 jq 斷言相同(沒有 parity.map.json 的 checkout:12 個節點配到 11)。
      # set +e:GitHub 的 bash 預設帶 -e,check 預期的 exit 1 會直接結束這一步
      - name: Real check on the offline demo
        run: |
          set +e
          set -uo pipefail
          work="$RUNNER_TEMP/demo"
          rm -rf "$work"; cp -r samples/demo "$work"
          (cd "$work" && parity check --config parity.config.json)
          code=$?
          report="$work/.parity/report.json"
          if [ "$code" -ne 1 ]; then echo "✗ 預期 exit 1(GATE FAIL),實際 $code"; exit 1; fi
          jq -e '(.reports | length) == 1
              and (.reports[0].summary | .designNodes == 12 and .matched == 11 and .unmatched == 1
                   and .nodesWithDiffs == 3 and .critical == 0 and .serious == 5 and .medium == 0 and .minor == 1)
              and ([.reports[0].nodes[].diffs[] | select(.soft)] | length) == 1' "$report" > /dev/null \
            || { echo "✗ 報告計數與預期不符"; jq '.reports[0].summary' "$report"; exit 1; }
          echo "✓ check 開了瀏覽器、寫出報告,計數正確"

      - name: Baseline database (this platform's SQLite)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/demo-baseline"
          rm -rf "$work"; cp -r samples/demo "$work"
          cd "$work"
          parity baseline save --config parity.config.json
          parity baseline list --config parity.config.json | grep -q '#1'
          parity check --config parity.config.json --baseline
          echo "✓ 基準存得進去、讀得出來,跟基準比沒有新問題"

  # 沒有 Playwright Node 的平台:Alpine 的 musl 包在真的容器裡裝;any 後備包讓 SDK 以為自己在 32 位元 ARM 上裝。
  # 基準資料庫由同架構的一般平台包真的開瀏覽器寫一份,讀別台機器寫的資料庫才是 SQLite 原生檔裝對了的證據。
  install-smoke-no-browser:
    needs: pack-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, musl: linux-musl-x64 }
          - { os: ubuntu-24.04-arm, musl: linux-musl-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: pkgs
      - name: Write a real baseline database
        run: |
          set -euo pipefail
          dotnet tool install --tool-path host-tool --add-source pkgs --version 0.0.0-ci Cornhsu.Parity
          host-tool/parity install-browser --with-deps
          cp -r samples/demo demo
          (cd demo && ../host-tool/parity baseline save --config parity.config.json)
      - name: The any package (a platform with no package of its own)
        env:
          INSTALL_RUNTIME_ID: linux-arm
        run: sh scripts/smoke-no-browser-platform.sh "$PWD/pkgs" 0.0.0-ci any "$PWD/demo"
      - name: Alpine in a container
        run: |
          docker run --rm -e DO_NOT_TRACK=1 -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 -v "$PWD:/repo:ro" \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh /repo/scripts/smoke-no-browser-platform.sh /repo/pkgs 0.0.0-ci ${{ matrix.musl }} /repo/demo

  # 最早的 .NET 10 SDK 要裝得起來、跑得動:README 寫的需求是「.NET 10 SDK」,不挑小版本。
  # 打包用的 SDK 會跟著 10.0.x 往上滾,哪天它打出來的包舊 SDK 看不懂,這裡會先紅。
  install-min-sdk:
    needs: pack-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: sdk
        with:
          dotnet-version: '10.0.100'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: pkgs
      - name: Install and run with exactly this SDK
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          # runner 上預裝了好幾版 SDK;global.json 鎖死成剛裝的這一版,不讓它往上滾
          mkdir -p work && cd work
          printf '{"sdk":{"version":"%s","rollForward":"disable"}}\n' "$SDK_VERSION" > global.json
          echo "SDK in use: $(dotnet --version)"
          dotnet tool install --tool-path tool --add-source ../pkgs --version 0.0.0-ci Cornhsu.Parity
          tool/parity --version
          echo "✓ 最早的 .NET 10 SDK 裝得起來、跑得動"

  # 網頁外殼前端(web/ → Parity.Server wwwroot)。tsc --noEmit 含在 build script 裡,
  # 型別錯誤就紅——伺服器端 API 形狀改了而前端型別沒跟上時,這裡會先叫。
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # 前端的純函式(例如 Figma 深連結的解析)用 Node 內建 test runner 跑,不另裝測試框架
      - run: npm test
        working-directory: web

  # 部署映像(網頁外殼 M5):建得起來、以非 root 起得來、/healthz 回 ok、前端有被打包進去、
  # 管理指令在容器裡寫得進 /data。維護者的開發機沒有 Docker,Dockerfile 只在這裡被實際驗證
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the server image
        run: docker build -t parity-server:ci .
      - name: Start it and probe it
        run: |
          set -euo pipefail
          docker run -d --name parity -p 8080:8080 parity-server:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec parity dotnet Parity.Server.dll create-project ci-smoke | grep -q "project created: ci-smoke"
          # 鐵則的實體化:映像裡不能有瀏覽器或引擎
          if docker exec parity sh -c 'ls /app | grep -iE "playwright|Parity\.Engine|ImageSharp"'; then
            echo "the server image contains browser or engine assemblies"; exit 1
          fi
      - name: Server log
        if: always()
        run: docker logs parity 2>&1 | tail -50

  build-test:
    name: Build + Test + Parity 自我把關
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Parity.slnx -c Release

      # 用剛建好的工具本身裝瀏覽器(順便 dogfood --with-deps)。
      # 刻意排在單元測試**之前**:SettleCaptureTests 需要真實瀏覽器,沒裝會自己略過——
      # 那條測的是量測正確性,靜靜略過等於沒驗。
      - name: Install Chromium (with system deps)
        run: dotnet run --project src/Parity.Cli -c Release --no-build -- install-browser --with-deps

      - name: Unit tests
        run: dotnet test Parity.slnx -c Release --no-build

      # README 的數字會走鐘:v0.13.1 當下就已經寫著「195 條測試」而實際是 197。
      # 加測試的人不會想到 README,所以讓 CI 自己數一次再比(測試數 / 發佈版數 / @v pin,
      # 兩份 README 一起)。不一致時跑 `pwsh scripts/verify-readme-facts.ps1 -Update` 重貼。
      # 刻意只在 ubuntu 跑一次、不進 matrix:三個 OS 比同一份文字只會多三倍換行與 locale 的雜訊。
      - name: Verify README facts
        run: pwsh scripts/verify-readme-facts.ps1 -NoBuild

      # 離線示範刻意做壞 → 預期 GATE FAIL(exit 1)。這正是 CI 把關該有的行為,
      # 所以「跑出 exit 1」= 成功;跑出別的才是回歸。
      # 只看退出碼不夠(XamlContrast 的 ci.yml 同一個形狀):再用 jq 驗報告計數,
      # 「工具真的會擋」與「擋的數量沒有莫名其妙變動」一起驗——配對規則或量測一改,這裡立刻紅。
      # 計數以「沒有 parity.map.json 的 checkout」為準(map 檔刻意不進版控):12 個設計節點配到 11、
      # 1 個未配對(hero-badge);3 個節點有落差,共 5 條 serious + 1 條 minor(font-family,soft)。
      # 本機跑過 `parity map` 的話會是 12/12,與這裡不同是正常的。
      # 這組數字也被 CliBrowserTests 對著 demo 的乾淨複本實跑比對,改數字前先確認那條測試。
      - name: Parity check (offline demo, 預期 GATE FAIL)
        run: |
          set +e
          dotnet run --project src/Parity.Cli -c Release --no-build -- \
            check --config samples/demo/parity.config.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "✗ 預期 exit 1(GATE FAIL),實際為 $code"
            exit 1
          fi
          echo "✓ 離線示範如預期 GATE FAIL(exit 1)——CI 把關行為正確"
          report=samples/demo/.parity/report.json
          jq -e '(.reports | length) == 1
            and (.reports[0].summary | .designNodes == 12 and .matched == 11 and .unmatched == 1
                 and .nodesWithDiffs == 3 and .critical == 0 and .serious == 5 and .medium == 0 and .minor == 1)
            and ([.reports[0].nodes[].diffs[] | select(.soft)] | length) == 1' \
            "$report" > /dev/null \
            || { echo "✗ demo 報告計數與預期不符"; jq '.reports[0].summary' "$report"; exit 1; }
          echo "✓ demo 報告計數正確"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: samples/demo/.parity/report.json
          if-no-files-found: ignore
