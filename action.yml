name: 'Parity design-fidelity check'
description: 'Property-level design fidelity check: compares the real numeric values of your Figma design and the rendered UI, fails CI when the gap exceeds the gate threshold, and posts the fidelity report on the PR.'
author: 'Cornhsu'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  config:
    description: 'Path to parity.config.json'
    required: false
    default: 'parity.config.json'
  target:
    description: 'Check only this route (omit to check all)'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run in'
    required: false
    default: '.'
  version:
    description: 'Cornhsu.Parity tool version (omit for the latest release of this action''s major version, e.g. the latest 1.x for @v1)'
    required: false
    default: ''
  figma-token:
    description: 'Figma token (passed as FIGMA_TOKEN; not needed when the design source is a local JSON file)'
    required: false
    default: ''
  baseline:
    description: 'Regression mode (check --baseline): only gate on diffs that are new or worse than parity.baseline.db (which must be committed to the repo)'
    required: false
    default: 'false'
  comment:
    description: 'Post/update the fidelity report as a PR comment (requires pull-requests: write)'
    required: false
    default: 'true'
  upload-report:
    description: 'Upload the report (report.json + Markdown) as an artifact'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # inputs 一律先進 env 再用 shell 變數引用,不直接 ${{ }} 內插進 run:。
    # 內插是在 shell 看到指令之前就完成的字串替換,呼叫端只要把 input 接到不可信的來源
    # (例如 `version: ${{ github.event.issue.body }}`),那段內容就會變成 runner 上的指令。
    # 走 env 的話它永遠只是一個字串值。
    - name: Install Parity
      shell: bash
      env:
        PARITY_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$PARITY_VERSION" ]; then
          dotnet tool install --global Cornhsu.Parity --version "$PARITY_VERSION"
        else
          # @v1 只跟隨 1.x(介面凍結的承諾):不帶範圍會裝到最新穩定版,2.0.0 一發佈就跨 major。
          # "1.*" 取最高的 1.x 穩定版;發 2.0.0 時這行要跟著改成 "2.*"(ActionYmlTests 會提醒)
          dotnet tool install --global Cornhsu.Parity --version "1.*"
        fi
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Install Chromium (with system deps)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: parity install-browser --with-deps

    # 先跑、先產報告,不在這步讓 job 失敗——要等報告貼上 PR 後再擋(見最後一步)
    - name: Run Parity check
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FIGMA_TOKEN: ${{ inputs.figma-token }}
        PARITY_CONFIG: ${{ inputs.config }}
        PARITY_TARGET: ${{ inputs.target }}
        PARITY_BASELINE: ${{ inputs.baseline }}
      run: |
        set +e
        # config/target 帶換行(\n 或 \r)一律拒絕,不呼叫 parity:parity 會把它們原樣印到 stderr,
        # 換行後的內容落在行首就成了 runner 會解析的 workflow command(::add-mask::、::set-output…)。
        # 訊息刻意不印出 input 本身;當成執行錯誤(exit 2),照常由最後一步擋
        case "$PARITY_CONFIG$PARITY_TARGET" in
          *$'\n'* | *$'\r'*)
            echo "parity action: the config or target input contains a line break; refusing to run." >&2
            echo "exit=2" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        args=(check --config "$PARITY_CONFIG" --md "$RUNNER_TEMP/parity-report.md")
        [ -n "$PARITY_TARGET" ] && args+=(--target "$PARITY_TARGET")
        [ "$PARITY_BASELINE" = "true" ] && args+=(--baseline)
        parity "${args[@]}"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        # artifact:check 把 report.json 寫在「設定檔所在目錄」的 .parity/,不是 working-directory
        # (config 放子目錄時兩者不同)。複製到 runner.temp 底下固定的目錄,上傳步驟只認那個目錄。
        # 刻意不用 step output 傳路徑:寫進 $GITHUB_OUTPUT 的值只要帶換行,每一行都會變成新的 output
        # (可以改寫 exit、指定上傳任意檔案)——這一步寫進 $GITHUB_OUTPUT 的只有上面那個數字。
        # 報告本身也不搬:使用者之後照預設路徑讀它的步驟照舊找得到。
        # 只複製一般檔案、不跟 symlink:repo 可以 commit 一個 .parity/report.json → /proc/self/environ,
        # parity 寫入失敗時 symlink 留著,cp 就會把這一步自己的環境(含 FIGMA_TOKEN)複製進 artifact
        # (指向 /dev/zero 則寫滿磁碟)。.parity 目錄本身是 symlink 也一樣不收
        artifact="$RUNNER_TEMP/parity-artifact"
        mkdir -p "$artifact"
        copy_plain() {
          if [ -f "$1" ] && [ ! -L "$1" ] && [ ! -L "$(dirname -- "$1")" ]; then
            cp -- "$1" "$2" 2>/dev/null || true
          fi
        }
        copy_plain "$(dirname -- "$PARITY_CONFIG")/.parity/report.json" "$artifact/report.json"
        copy_plain "$RUNNER_TEMP/parity-report.md" "$artifact/parity-report.md"

    # 把還原度報告貼成 PR 留言(同一則留言反覆更新,不洗版)。
    # continue-on-error:fork PR 的 GITHUB_TOKEN 唯讀,貼留言會 403——那是預期的,
    # 不該讓整個 job 紅在這步(gate 仍在最後一步照常擋)。
    - name: Comment report on PR
      if: ${{ github.event_name == 'pull_request' && inputs.comment == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        report="$RUNNER_TEMP/parity-report.md"
        out="$RUNNER_TEMP/parity-comment.md"
        [ -f "$report" ] || { echo "no report to post"; exit 0; }
        marker='<!-- parity-report -->'
        # GitHub 留言上限 ~65536 字,超過就截斷並附提示(完整內容在 artifact)
        if [ "$(wc -c < "$report")" -gt 60000 ]; then
          { echo "$marker"; head -c 60000 "$report"; printf '\n\n<sub>⚠️ Report truncated because it exceeds the comment size limit — see the parity-report artifact on this workflow run for the full version.</sub>\n'; } > "$out"
        else
          { echo "$marker"; cat "$report"; } > "$out"
        fi
        pr="$PR_NUMBER"
        # --paginate:不分頁只看得到第一頁(30 則,舊的在前),PR 留言一多就找不到舊留言、每次都發新的。
        # --jq 是逐頁套用,所以逐筆輸出 id,再在 shell 裡取第一筆(最舊的那則)。
        # 只認 github-actions[bot] 自己的留言(GH_TOKEN 是 github.token):任何人都能搶先貼一則以 marker
        # 開頭的留言,不看作者的話 bot 會去改那則——改不了(403)就永遠貼不上,改得了就是改到別人的內容
        ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
          --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- parity-report -->"))) | .id')
        existing=${ids%%$'\n'*}
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$out" >/dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@"$out" >/dev/null
        fi

    - name: Upload report
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: parity-report
        # check 步驟複製好的固定目錄(report.json + parity-report.md);路徑不來自任何 step output
        path: ${{ runner.temp }}/parity-artifact
        if-no-files-found: ignore

    # 報告貼完了,現在才依 gate 結論決定 job 成敗
    - name: Enforce gate
      shell: bash
      env:
        PARITY_EXIT: ${{ steps.check.outputs.exit }}
      run: exit "$PARITY_EXIT"
